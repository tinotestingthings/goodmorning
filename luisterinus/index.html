<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Luisterinus</title>
  <style>
    :root { --bg: #f5f5f7; --card: #ffffff; --text: #111827; --muted: #6b7280; --line: #e5e7eb; --blue: #2f6fd1; --red: #c0392b; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f1115; --card: #1a1d24; --text: #f3f4f6; --muted: #9aa0aa; --line: #2a2f39; --blue: #7fb0ff; --red: #ff7b6b; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 16px; max-width: 640px; margin-inline: auto; }
    h1 { font-size: 1.25rem; margin: 4px 0 2px; }
    .sub { color: var(--muted); font-size: 0.85rem; margin: 0 0 14px; }
    .row { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
    .title { font-weight: 600; line-height: 1.3; }
    .meta { color: var(--muted); font-size: 0.8rem; margin-top: 3px; display: flex; gap: 10px; }
    .meta a { color: var(--blue); text-decoration: none; }
    .slot { margin-top: 8px; }
    .play { border: 0; background: none; padding: 0; color: var(--blue); font: inherit; font-weight: 600; cursor: pointer; }
    .play:disabled { opacity: 0.5; }
    .status { color: var(--muted); font-size: 0.9rem; }
    .status.failed { color: var(--red); margin-right: 10px; }
    audio.player { width: 100%; height: 32px; }
    .empty, #msg { color: var(--muted); font-size: 0.9rem; }
    #msg:empty { display: none; }
  </style>
</head>
<body>
  <h1>Luisterinus</h1>
  <p class="sub">Podcasts uit je digest — de laatste 14 dagen.</p>
  <p id="msg"></p>
  <div id="list"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="boot.js"></script>
</body>
</html>
