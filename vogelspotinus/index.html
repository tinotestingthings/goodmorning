<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Vogelspotinus</title>
<meta name="theme-color" content="#2f6f4f" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- Shared icon sprite: one consistent, theme-aware (currentColor) line-icon
     set used everywhere in the app instead of emoji, referenced via
     <svg class="icon"><use href="#icon-NAME"/></svg> (see icon() in app.js). -->
<svg style="display:none" aria-hidden="true">
  <symbol id="icon-home" viewBox="0 0 24 24"><path d="M4 12 L12 4 L20 12" /><path d="M6 11 V20 H18 V11" /></symbol>
  <symbol id="icon-book" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="16" rx="1.2" /><rect x="13" y="4" width="7" height="16" rx="1.2" /></symbol>
  <symbol id="icon-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" /><circle cx="12" cy="12" r="4" /><circle cx="12" cy="12" r="1.1" fill="currentColor" stroke="none" /></symbol>
  <symbol id="icon-sliders" viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6" /><circle cx="9" cy="6" r="2" /><line x1="4" y1="12" x2="20" y2="12" /><circle cx="15" cy="12" r="2" /><line x1="4" y1="18" x2="20" y2="18" /><circle cx="7" cy="18" r="2" /></symbol>
  <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6" /><line x1="15" y1="15" x2="20" y2="20" /></symbol>
  <symbol id="icon-star" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26" /></symbol>
  <symbol id="icon-close" viewBox="0 0 24 24"><line x1="5" y1="5" x2="19" y2="19" /><line x1="19" y1="5" x2="5" y2="19" /></symbol>
  <symbol id="icon-speaker" viewBox="0 0 24 24"><polygon points="4 9 8 9 13 4 13 20 8 15 4 15" /><path d="M16.5 8.5 Q19.5 12 16.5 15.5" /><path d="M19 6 Q23.5 12 19 18" /></symbol>
  <symbol id="icon-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1.5" fill="currentColor" stroke="none" /></symbol>
  <symbol id="icon-plus" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" /></symbol>
  <symbol id="icon-pencil" viewBox="0 0 24 24"><path d="M4 20 L4 16 L15 5 L19 9 L8 20 Z" /><line x1="13" y1="7" x2="17" y2="11" /></symbol>
  <symbol id="icon-trash" viewBox="0 0 24 24"><line x1="5" y1="7" x2="19" y2="7" /><path d="M9 7 V5 H15 V7" /><path d="M7 7 L8 20 H16 L17 7" /><line x1="10" y1="11" x2="10" y2="16" /><line x1="14" y1="11" x2="14" y2="16" /></symbol>
  <symbol id="icon-check" viewBox="0 0 24 24"><polyline points="4 12 9 17 20 6" /></symbol>
  <symbol id="icon-arrow-right" viewBox="0 0 24 24"><line x1="4" y1="12" x2="18" y2="12" /><polyline points="12 6 18 12 12 18" /></symbol>
  <symbol id="icon-eye" viewBox="0 0 24 24"><path d="M2 12 C5 6 19 6 22 12 C19 18 5 18 2 12 Z" /><circle cx="12" cy="12" r="3" /></symbol>
  <symbol id="icon-cap" viewBox="0 0 24 24"><polygon points="12 4 22 9 12 14 2 9" /><path d="M6 11 V16 C6 18 9 19 12 19 C15 19 18 18 18 16 V11" /><line x1="22" y1="9" x2="22" y2="15" /></symbol>
  <symbol id="icon-list-check" viewBox="0 0 24 24"><line x1="9" y1="6" x2="20" y2="6" /><polyline points="3 6 4.5 7.5 6.5 5" /><line x1="9" y1="12" x2="20" y2="12" /><polyline points="3 12 4.5 13.5 6.5 11" /><line x1="9" y1="18" x2="20" y2="18" /><polyline points="3 18 4.5 19.5 6.5 17" /></symbol>
  <symbol id="icon-cursor" viewBox="0 0 24 24"><line x1="12" y1="4" x2="12" y2="20" /><line x1="8" y1="4" x2="16" y2="4" /><line x1="8" y1="20" x2="16" y2="20" /></symbol>
  <symbol id="icon-bird" viewBox="0 0 24 24"><path class="icon-fill" d="M12 11.38 C14.88 7.42 17.58 6.7 21 10.12 C16.95 13.45 13.8 14.98 12 16.06 C10.2 14.98 7.05 13.45 3 10.12 C6.42 6.7 9.12 7.42 12 11.38 Z" fill="currentColor" stroke="none" /></symbol>
</svg>

<div class="app" style="visibility:hidden">

  <!-- HOME -->
  <section id="screen-home" class="screen">
    <header class="top">
      <h1><svg class="icon icon-logo"><use href="#icon-bird"/></svg> Vogelspotinus</h1>
    </header>
    <div class="tile-grid" id="home-tiles"></div>
    <h2 class="section-heading" id="custom-games-heading" style="display:none;" data-i18n="yourGames"></h2>
    <div class="tile-grid" id="custom-game-tiles"></div>
  </section>

  <!-- BROWSE -->
  <section id="screen-browse" class="screen" style="display:none;">
    <header class="top">
      <h1 data-i18n="browse"></h1>
    </header>
    <div class="controls">
      <div class="search-wrap">
        <svg class="icon"><use href="#icon-search"/></svg>
        <input type="search" id="search-input" data-i18n-placeholder="searchPlaceholder" />
      </div>
      <button class="options-btn" id="browse-filters-btn"><svg class="icon"><use href="#icon-sliders"/></svg> <span data-i18n="options"></span></button>
    </div>
    <p class="count-line" id="browse-count"></p>
    <div class="grid" id="grid"></div>
    <p class="empty-state" id="empty-state" style="display:none;" data-i18n="noResults"></p>
  </section>

  <!-- Browse options sheet -->
  <div class="overlay hidden" id="browse-options-overlay">
    <div class="detail-sheet" id="browse-options-sheet">
      <button class="detail-close" id="browse-options-close"><svg class="icon"><use href="#icon-close"/></svg></button>
      <div class="detail-body">
        <h2 data-i18n="options"></h2>
        <p class="count-line" id="browse-options-count"></p>
        <div class="filter-bar" id="browse-filter-bar"></div>
      </div>
    </div>
  </div>

  <!-- QUIZ -->
  <section id="screen-quiz" class="screen" style="display:none;">
    <header class="top quiz-header">
      <h1 data-i18n="quiz"></h1>
      <p class="quiz-score" id="quiz-score"></p>
      <button class="options-btn" id="quiz-options-btn"><svg class="icon"><use href="#icon-sliders"/></svg> <span data-i18n="options"></span></button>
    </header>

    <div class="quiz-card" id="quiz-answer-card">
      <div class="quiz-image-wrap">
        <img id="quiz-image" alt="" />
      </div>
      <div class="quiz-sound-row" id="quiz-sound-row" style="display:none;">
        <button class="secondary" id="quiz-play-sound"><svg class="icon"><use href="#icon-speaker"/></svg> <span data-i18n="playCall"></span></button>
      </div>
      <div id="quiz-text-controls">
        <input type="text" id="quiz-input" autocomplete="off" />
        <div class="quiz-actions">
          <button class="primary" id="quiz-submit" data-i18n="check"></button>
          <button class="secondary" id="quiz-reveal" data-i18n="reveal"></button>
          <button class="secondary" id="quiz-next" data-i18n="nextBird"></button>
        </div>
      </div>
      <div id="quiz-choice-controls" style="display:none;">
        <div class="choice-grid" id="quiz-choice-grid"></div>
        <div class="quiz-actions">
          <button class="secondary" id="quiz-choice-next" data-i18n="nextBird"></button>
        </div>
      </div>
      <p class="quiz-result" id="quiz-result"></p>
      <div id="quiz-answer" class="quiz-answer-names"></div>
    </div>

    <div class="quiz-card" id="study-card" style="display:none;">
      <div id="study-content"></div>
    </div>
  </section>

  <!-- Quiz options sheet -->
  <div class="overlay hidden" id="quiz-options-overlay">
    <div class="detail-sheet" id="quiz-options-sheet">
      <button class="detail-close" id="quiz-options-close"><svg class="icon"><use href="#icon-close"/></svg></button>
      <div class="detail-body">
        <h2 data-i18n="options"></h2>
        <div class="quiz-mode-switch" id="quiz-mode-switch">
          <button id="quiz-mode-text" class="active" data-i18n="typeAnswer"></button>
          <button id="quiz-mode-choice" data-i18n="multipleChoice"></button>
          <button id="quiz-mode-study" data-i18n="study"></button>
        </div>
        <p class="count-line" id="quiz-options-count"></p>
        <div class="filter-bar" id="quiz-filter-bar"></div>
      </div>
    </div>
  </div>

  <!-- CUSTOM GAME BUILDER -->
  <section id="screen-builder" class="screen" style="display:none;">
    <header class="top">
      <h1 data-i18n="customGame"></h1>
    </header>

    <div class="quiz-mode-switch">
      <button id="builder-mode-tags" class="active" data-i18n="filterByTags"></button>
      <button id="builder-mode-specific" data-i18n="pickSpecificBirds"></button>
    </div>

    <div id="builder-filter-bar"></div>

    <div id="builder-specific-picker" style="display:none;">
      <div class="controls">
        <input type="text" id="builder-bird-search" data-i18n-placeholder="searchBirdsPlaceholder" />
      </div>
      <div class="chip-row" id="builder-selected-birds"></div>
      <div class="bird-pick-list" id="builder-bird-results"></div>
    </div>

    <p class="count-line" id="builder-count"></p>
    <div class="builder-field">
      <label data-i18n="gameMode"></label>
      <select id="builder-mode-select">
        <option value="browse" data-i18n="browse"></option>
        <option value="quiz-text" data-i18n="quizTypeAnswer"></option>
        <option value="quiz-choice" data-i18n="quizMultipleChoice"></option>
        <option value="quiz-study" data-i18n="study"></option>
      </select>
    </div>
    <div class="builder-field">
      <label data-i18n="gameName"></label>
      <input type="text" id="builder-name-input" />
    </div>
    <div class="quiz-actions">
      <button class="primary" id="builder-save" data-i18n="saveGame"></button>
      <button class="secondary" id="builder-cancel" data-i18n="cancel"></button>
    </div>
  </section>

  <!-- SETTINGS -->
  <section id="screen-settings" class="screen" style="display:none;">
    <header class="top">
      <h1 data-i18n="settings"></h1>
    </header>
    <div class="builder-field">
      <label data-i18n="language"></label>
      <div class="lang-switch">
        <button id="lang-nl" data-lang="nl">🇳🇱 Nederlands</button>
        <button id="lang-en" data-lang="en">🇬🇧 English</button>
      </div>
    </div>
    <div class="builder-field">
      <label data-i18n="theme"></label>
      <div class="chip-row" id="theme-switch"></div>
    </div>
    <div class="builder-field">
      <label data-i18n="customizeTheme"></label>
      <div id="theme-customizer"></div>
    </div>
  </section>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-screen="home">
      <span class="nav-icon"><svg class="icon"><use href="#icon-home"/></svg></span><span data-i18n="home"></span>
    </button>
    <button class="nav-btn" data-screen="browse">
      <span class="nav-icon"><svg class="icon"><use href="#icon-book"/></svg></span><span data-i18n="browse"></span>
    </button>
    <button class="nav-btn" data-screen="quiz">
      <span class="nav-icon"><svg class="icon"><use href="#icon-target"/></svg></span><span data-i18n="quiz"></span>
    </button>
    <button class="nav-btn" data-screen="settings">
      <span class="nav-icon"><svg class="icon"><use href="#icon-sliders"/></svg></span><span data-i18n="settings"></span>
    </button>
  </nav>
</div>

<!-- Detail sheet -->
<div class="overlay hidden" id="detail-overlay">
  <div class="detail-sheet" id="detail-sheet"></div>
</div>

<!-- Fullscreen photo viewer -->
<div class="fullscreen-viewer hidden" id="fullscreen-viewer">
  <img id="fullscreen-image" alt="" />
</div>

<audio id="sound-player" preload="none"></audio>

<!-- Supabase Auth + sync: boot.js gates on a Daily Digest session, seeds
     localStorage from the per-user vogelspotinus_state row, then injects the
     app scripts (app.js, browse.js, quiz.js, study.js, custom-games.js). -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="boot.js"></script>
</body>
</html>
