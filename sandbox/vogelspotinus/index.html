<!doctype html>
<html lang="nl">
  <head>
    <script src="../launch.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Spotinus</title>
    <meta
      name="description"
      content="Leer de namen van de dieren die je kunt spotten: vogels en hondenrassen."
    />
    <meta name="theme-color" content="#f4f1ea" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <!-- Instrument Sans + JetBrains Mono dragen de "Inkt"-look. Beide hebben een
         fallback met vergelijkbare metrics, zodat het scherm offline (of voordat
         de fonts binnen zijn) niet verspringt. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="preload" href="data/birds.json" as="fetch" crossorigin="anonymous" />
  </head>
  <body>
    <!--
  This file is the STATIC FRAME only: screens, their headings, and the
  containers dynamic content is rendered into. Every piece of dynamic content
  is built in JavaScript with h() (see src/core/dom.js). Static copy is marked
  with data-i18n / data-i18n-placeholder / data-i18n-label and filled by
  applyStaticTranslations() -- it is never set from JS by element id.
-->

    <!-- Shared icon sprite: one consistent, theme-aware (currentColor) line-icon
     set used everywhere instead of emoji, referenced via icon() in dom.js. -->
    <svg style="display: none" aria-hidden="true" focusable="false">
      <symbol id="icon-home" viewBox="0 0 24 24">
        <path d="M4 12 L12 4 L20 12" />
        <path d="M6 11 V20 H18 V11" />
      </symbol>
      <symbol id="icon-book" viewBox="0 0 24 24">
        <rect x="4" y="4" width="7" height="16" rx="1.2" />
        <rect x="13" y="4" width="7" height="16" rx="1.2" />
      </symbol>
      <symbol id="icon-target" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="8" />
        <circle cx="12" cy="12" r="4" />
        <circle cx="12" cy="12" r="1.1" fill="currentColor" stroke="none" />
      </symbol>
      <symbol id="icon-sliders" viewBox="0 0 24 24">
        <line x1="4" y1="6" x2="20" y2="6" />
        <circle cx="9" cy="6" r="2" />
        <line x1="4" y1="12" x2="20" y2="12" />
        <circle cx="15" cy="12" r="2" />
        <line x1="4" y1="18" x2="20" y2="18" />
        <circle cx="7" cy="18" r="2" />
      </symbol>
      <symbol id="icon-search" viewBox="0 0 24 24">
        <circle cx="10" cy="10" r="6" />
        <line x1="15" y1="15" x2="20" y2="20" />
      </symbol>
      <symbol id="icon-star" viewBox="0 0 24 24">
        <polygon
          points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26"
        />
      </symbol>
      <symbol id="icon-close" viewBox="0 0 24 24">
        <line x1="5" y1="5" x2="19" y2="19" />
        <line x1="19" y1="5" x2="5" y2="19" />
      </symbol>
      <symbol id="icon-speaker" viewBox="0 0 24 24">
        <polygon points="4 9 8 9 13 4 13 20 8 15 4 15" />
        <path d="M16.5 8.5 Q19.5 12 16.5 15.5" />
        <path d="M19 6 Q23.5 12 19 18" />
      </symbol>
      <symbol id="icon-stop" viewBox="0 0 24 24">
        <rect x="7" y="7" width="10" height="10" rx="1.5" fill="currentColor" stroke="none" />
      </symbol>
      <symbol id="icon-plus" viewBox="0 0 24 24">
        <line x1="12" y1="5" x2="12" y2="19" />
        <line x1="5" y1="12" x2="19" y2="12" />
      </symbol>
      <symbol id="icon-pencil" viewBox="0 0 24 24">
        <path d="M4 20 L4 16 L15 5 L19 9 L8 20 Z" />
        <line x1="13" y1="7" x2="17" y2="11" />
      </symbol>
      <symbol id="icon-trash" viewBox="0 0 24 24">
        <line x1="5" y1="7" x2="19" y2="7" />
        <path d="M9 7 V5 H15 V7" />
        <path d="M7 7 L8 20 H16 L17 7" />
        <line x1="10" y1="11" x2="10" y2="16" />
        <line x1="14" y1="11" x2="14" y2="16" />
      </symbol>
      <symbol id="icon-check" viewBox="0 0 24 24"><polyline points="4 12 9 17 20 6" /></symbol>
      <symbol id="icon-eye" viewBox="0 0 24 24">
        <path d="M2 12 C5 6 19 6 22 12 C19 18 5 18 2 12 Z" />
        <circle cx="12" cy="12" r="3" />
      </symbol>
      <symbol id="icon-cap" viewBox="0 0 24 24">
        <polygon points="12 4 22 9 12 14 2 9" />
        <path d="M6 11 V16 C6 18 9 19 12 19 C15 19 18 18 18 16 V11" />
        <line x1="22" y1="9" x2="22" y2="15" />
      </symbol>
      <symbol id="icon-list-check" viewBox="0 0 24 24">
        <line x1="9" y1="6" x2="20" y2="6" />
        <polyline points="3 6 4.5 7.5 6.5 5" />
        <line x1="9" y1="12" x2="20" y2="12" />
        <polyline points="3 12 4.5 13.5 6.5 11" />
        <line x1="9" y1="18" x2="20" y2="18" />
        <polyline points="3 18 4.5 19.5 6.5 17" />
      </symbol>
      <symbol id="icon-cursor" viewBox="0 0 24 24">
        <line x1="12" y1="4" x2="12" y2="20" />
        <line x1="8" y1="4" x2="16" y2="4" />
        <line x1="8" y1="20" x2="16" y2="20" />
      </symbol>
      <symbol id="icon-binoculars" viewBox="0 0 24 24">
        <path d="M9 4 H6 L4 13" />
        <path d="M15 4 H18 L20 13" />
        <circle cx="5.5" cy="16" r="4" />
        <circle cx="18.5" cy="16" r="4" />
        <path d="M9.5 15 H14.5" />
        <path d="M10 4 V11" />
        <path d="M14 4 V11" />
      </symbol>
    </svg>

    <!-- Boot state: loading spinner, or a retry panel if the data fetch fails. -->
    <div id="boot" class="boot"></div>

    <div class="app" id="app" hidden>
      <!-- HOME -->
      <section id="screen-home" class="screen" hidden>
        <header class="top">
          <h1 tabindex="-1">
            <svg class="icon icon-logo" aria-hidden="true" focusable="false">
              <use href="#icon-binoculars" />
            </svg>
            Spotinus
          </h1>
        </header>
        <div id="home-daily"></div>
        <div id="home-progress"></div>
        <div class="quiet-row" id="home-tiles"></div>
        <h2 class="section-heading" id="custom-games-heading" data-i18n="yourGames" hidden></h2>
        <div class="tile-grid" id="custom-game-tiles"></div>
      </section>

      <!-- OEFENSESSIE (geen nav-knop; gestart vanaf de cursuskaart op Home) -->
      <section id="screen-session" class="screen" hidden>
        <!-- Eigen header, niet de quiz-header: die verbergt zijn h1 onder 26rem
             omdat de bottom-nav dan zegt waar je bent. Voor dit scherm klopt dat
             niet -- het heeft geen nav-knop, dus zonder titel en sluitkruis sta
             je op een naamloos scherm zonder zichtbare uitgang. -->
        <header class="top session-header">
          <button type="button" id="session-close" class="icon-btn" data-i18n-label="closeSession">
            <svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-close" /></svg>
          </button>
          <h1 tabindex="-1" data-i18n="sessionTitle"></h1>
          <p class="quiz-status" id="session-status" role="status" aria-live="polite"></p>
        </header>
        <div id="session-body"></div>
      </section>

      <!-- BROWSE -->
      <section id="screen-browse" class="screen" hidden>
        <header class="top">
          <h1 tabindex="-1" data-i18n="browse"></h1>
        </header>
        <div class="segmented" id="browse-kind" role="group"></div>
        <div class="controls" id="browse-search-row">
          <div class="search-wrap">
            <svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-search" /></svg>
            <input
              type="search"
              id="browse-search"
              data-i18n-placeholder="searchPlaceholder"
              data-i18n-label="searchPlaceholder"
            />
          </div>
          <button type="button" class="options-btn" id="browse-options-btn">
            <svg class="icon" aria-hidden="true" focusable="false">
              <use href="#icon-sliders" />
            </svg>
            <span data-i18n="options"></span>
          </button>
        </div>
        <p class="count-line" id="browse-count" role="status" aria-live="polite"></p>
        <div class="grid" id="browse-grid"></div>
        <p class="empty-state" id="browse-empty" data-i18n="noResults" hidden></p>
        <div id="browse-sentinel" aria-hidden="true" hidden></div>
      </section>

      <!-- QUIZ -->
      <section id="screen-quiz" class="screen" hidden>
        <header class="top quiz-header">
          <h1 tabindex="-1" data-i18n="quiz"></h1>
          <p class="quiz-status" id="quiz-status" role="status" aria-live="polite"></p>
          <button type="button" class="options-btn" id="quiz-options-btn">
            <svg class="icon" aria-hidden="true" focusable="false">
              <use href="#icon-sliders" />
            </svg>
            <span data-i18n="options"></span>
          </button>
        </header>
        <div class="segmented" id="quiz-kind" role="group"></div>
        <div id="quiz-body"></div>
      </section>

      <!-- CUSTOM GAME BUILDER -->
      <section id="screen-builder" class="screen" hidden>
        <header class="top">
          <h1 tabindex="-1" data-i18n="customGame"></h1>
        </header>

        <div
          class="segmented"
          id="builder-pick-mode"
          role="group"
          data-i18n-label="customGame"
        ></div>

        <div id="builder-filter-bar"></div>

        <div id="builder-specific-picker" hidden>
          <div class="controls">
            <input
              type="search"
              id="builder-bird-search"
              data-i18n-placeholder="searchBirdsPlaceholder"
              data-i18n-label="searchBirdsPlaceholder"
            />
          </div>
          <div class="chip-row" id="builder-selected"></div>
          <div class="pick-list" id="builder-bird-results"></div>
        </div>

        <p class="count-line" id="builder-count" role="status" aria-live="polite"></p>

        <div class="field-row">
          <label for="builder-mode-select" data-i18n="gameMode"></label>
          <select id="builder-mode-select">
            <option value="browse" data-i18n="browse"></option>
            <option value="quiz-text" data-i18n="quizTypeAnswer"></option>
            <option value="quiz-choice" data-i18n="quizMultipleChoice"></option>
            <option value="quiz-study" data-i18n="study"></option>
          </select>
        </div>
        <div class="field-row">
          <label for="builder-name" data-i18n="gameName"></label>
          <input type="text" id="builder-name" />
        </div>
        <div class="quiz-actions">
          <button type="button" class="primary" id="builder-save" data-i18n="saveGame"></button>
          <button type="button" class="secondary" id="builder-cancel" data-i18n="cancel"></button>
        </div>
      </section>

      <!-- SETTINGS -->
      <section id="screen-settings" class="screen" hidden>
        <header class="top">
          <h1 tabindex="-1" data-i18n="settings"></h1>
        </header>
        <div class="field-row">
          <p class="field-legend" data-i18n="language"></p>
          <div
            class="segmented segmented-wide"
            id="language-switch"
            role="group"
            data-i18n-label="language"
          ></div>
        </div>
        <div class="field-row">
          <p class="field-legend" data-i18n="soundQuestions"></p>
          <div
            class="segmented segmented-wide"
            id="sound-switch"
            role="group"
            data-i18n-label="soundQuestions"
          ></div>
          <p class="count-line" data-i18n="soundQuestionsHint"></p>
        </div>
        <div class="field-row">
          <p class="field-legend" data-i18n="theme"></p>
          <div class="chip-row" id="theme-switch" role="group" data-i18n-label="theme"></div>
        </div>
        <div class="field-row">
          <p class="field-legend" data-i18n="customizeTheme"></p>
          <div id="theme-customizer"></div>
        </div>
      </section>

      <nav class="bottom-nav" data-i18n-label="home">
        <button type="button" class="nav-btn" data-screen="home">
          <span class="nav-icon"
            ><svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-home" /></svg
          ></span>
          <span data-i18n="home"></span>
        </button>
        <button type="button" class="nav-btn" data-screen="browse">
          <span class="nav-icon"
            ><svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-book" /></svg
          ></span>
          <span data-i18n="browse"></span>
        </button>
        <button type="button" class="nav-btn" data-screen="quiz">
          <span class="nav-icon"
            ><svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-target" /></svg
          ></span>
          <span data-i18n="quiz"></span>
        </button>
        <button type="button" class="nav-btn" data-screen="settings">
          <span class="nav-icon"
            ><svg class="icon" aria-hidden="true" focusable="false">
              <use href="#icon-sliders" /></svg
          ></span>
          <span data-i18n="settings"></span>
        </button>
      </nav>
    </div>

    <!-- src/main.js wordt NIET hier geladen: boot.js injecteert het pas na de
         Supabase-pull, zodat de app hydrateert uit gesynchroniseerde state. -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="boot.js"></script>
  </body>
</html>
