<!doctype html>
<html lang="nl">
<head>
  <script src="../theme-sync.js"></script>
  <script>try { if (window.top !== window.self) document.documentElement.className = "embedded"; } catch (e) {}</script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Utrecht Toen</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.8.0/maplibre-gl.css" />
  <style>
    /* Vangnet als ../design.css niet laadt: anders valt elke var() weg. */
    :root { --bg: #f5f6f8; --card: #fff; --text: #1a1d24; --muted: #5a6270; --line: #dde1e6;
            --blue: #4a90d9; --red: #d9534f; --radius: 14px; --radius-sm: 8px;
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); overflow: hidden; }
    #app { position: relative; height: 100dvh; }
    #map { position: absolute; inset: 0; }
    .maplibregl-ctrl-attrib { font-size: 10px; }
    button, select, input { font: inherit; color: inherit; }

    /* Bovenbalk: één rij knoppen op de kaart */
    .bar { position: absolute; top: 0; left: 0; right: 0; z-index: 2; display: flex; gap: 6px; padding: 10px;
           padding-top: max(10px, env(safe-area-inset-top)); overflow-x: auto; scrollbar-width: none; }
    .bar::-webkit-scrollbar { display: none; }
    .chip { flex-shrink: 0; display: inline-flex; align-items: center; gap: 6px; background: var(--card); color: var(--text);
            border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; font-size: 0.85rem; cursor: pointer;
            box-shadow: var(--shadow, none); white-space: nowrap; }
    .chip.primary { color: var(--blue); font-weight: 600; }
    .chip:disabled { opacity: 0.5; cursor: default; }
    .chip svg { width: 16px; height: 16px; }
    .chip select { appearance: none; -webkit-appearance: none; border: 0; background: none; padding: 0; margin: 0; cursor: pointer; }
    .chip input[type=number] { width: 3.6em; border: 0; background: none; padding: 0; text-align: center; -moz-appearance: textfield; }
    .chip input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
    .chip .n { color: var(--muted); font-size: 0.8rem; }
    #stories { position: absolute; z-index: 3; top: 56px; left: 10px; right: 10px; max-width: 360px; background: var(--card);
               border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: none; }
    #stories.on { display: block; }
    #stories p { margin: 0 0 8px; color: var(--muted); font-size: 0.8rem; }
    #stories label { display: flex; gap: 8px; align-items: center; padding: 5px 0; font-size: 0.9rem; }

    #msg { position: absolute; z-index: 2; left: 10px; right: 10px; top: 58px; margin: 0 auto; max-width: 420px;
           background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 8px 12px;
           font-size: 0.85rem; color: var(--muted); display: none; }
    #msg.on { display: flex; gap: 10px; align-items: center; }
    #msg.bad { color: var(--red); }
    #msg button { margin-left: auto; border: 0; background: none; padding: 0 4px; color: inherit; cursor: pointer; }

    /* Dichtstbijzijnd: strook onderaan, alleen zichtbaar zonder selectie */
    #dock { position: absolute; z-index: 2; left: 0; right: 0; bottom: 0; padding: 0 10px max(10px, env(safe-area-inset-bottom));
            display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
    #dock::-webkit-scrollbar { display: none; }
    #dock:empty { display: none; }
    #dock .empty { color: var(--muted); font-size: 0.85rem; background: var(--card); border: 1px solid var(--line);
                   border-radius: var(--radius-sm); padding: 8px 12px; }
    .card { flex-shrink: 0; width: 150px; display: flex; flex-direction: column; text-align: left; background: var(--card); color: inherit;
            border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 0; overflow: hidden; cursor: pointer; }
    .card img { width: 100%; height: 84px; object-fit: cover; display: block; background: var(--line); }
    .card b { display: block; font-size: 0.78rem; font-weight: 600; padding: 6px 8px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card small { color: var(--muted); font-size: 0.72rem; padding: 2px 8px 7px; }
    .has-sel #dock { display: none; }

    /* Fotoblad: schuift van onderen over de kaart */
    #sheet { position: absolute; z-index: 4; left: 0; right: 0; bottom: 0; max-height: 62dvh; overflow-y: auto; background: var(--card);
             border-top: 1px solid var(--line); border-radius: var(--radius) var(--radius) 0 0; display: none;
             padding-bottom: max(12px, env(safe-area-inset-bottom)); }
    @media (min-width: 900px) { #sheet { left: auto; top: 0; bottom: 0; max-height: none; width: 420px; border-radius: 0; border-left: 1px solid var(--line); } }
    .has-sel #sheet { display: block; }
    .close { position: absolute; top: 8px; right: 8px; z-index: 1; width: 34px; height: 34px; border-radius: 50%; border: 0; background: rgba(0,0,0,.55); color: #fff;
             font-size: 1.2rem; line-height: 1; cursor: pointer; }
    .frame { position: relative; background: var(--line); }
    .frame img { width: 100%; max-height: 40dvh; object-fit: contain; display: block; cursor: zoom-in; background: #000; }
    .frame .date { position: absolute; left: 10px; bottom: 10px; background: rgba(0,0,0,.6); color: #fff; padding: 3px 8px; border-radius: 999px; font-size: 0.78rem; }
    .frame .fail { display: none; padding: 40px 16px; text-align: center; color: var(--muted); font-size: 0.85rem; }
    .frame.failed img { display: none; } .frame.failed .fail { display: block; }
    .body { padding: 12px 16px 4px; }
    .body h2 { font-size: 1.05rem; margin: 0 0 6px; line-height: 1.3; }
    .body .desc { margin: 0 0 12px; font-size: 0.9rem; line-height: 1.5; }
    .tier { border-left: 3px solid var(--blue); padding: 6px 10px; margin: 0 0 12px; font-size: 0.85rem; }
    .tier.street { border-color: var(--muted); }
    .tier strong { display: block; }
    .tier em { font-style: normal; color: var(--blue); font-weight: 600; margin-left: 6px; }
    .tier span { color: var(--muted); }
    .rev, .ctx { border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px 12px; margin: 0 0 12px; font-size: 0.85rem; }
    .rev header { display: flex; justify-content: space-between; margin-bottom: 4px; }
    .rev p { margin: 0 0 8px; color: var(--muted); }
    .ctx strong { display: block; margin-bottom: 4px; }
    .ctx ul { margin: 0; padding-left: 18px; } .ctx li { margin: 2px 0; }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 0; font-size: 0.85rem; }
    dt { color: var(--muted); } dd { margin: 0; overflow-wrap: anywhere; } dd small { display: block; color: var(--muted); }
    a { color: var(--blue); text-decoration: none; }
    details { margin: 0 0 12px; font-size: 0.85rem; }
    summary { cursor: pointer; color: var(--blue); font-weight: 600; padding: 6px 0; }
    .note { color: var(--muted); font-size: 0.78rem; margin: 10px 0 0; line-height: 1.4; }
    .nav { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--line); padding-top: 10px; margin-top: 4px; }
    .nav button { border: 0; background: none; padding: 6px 0; color: var(--blue); font-weight: 600; cursor: pointer; }
    .nav span { color: var(--muted); font-size: 0.85rem; }

    .act { display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 4px 0 12px; color: var(--blue); font-weight: 600; cursor: pointer; }
    .act svg { width: 18px; height: 18px; }

    /* Toen & nu: camera met de oude foto half doorzichtig eroverheen, daarna het resultaat */
    #cam { position: fixed; inset: 0; z-index: 11; background: #000; display: none; }
    #cam.on { display: block; }
    /* Beeld en resultaat blijven boven de knoppenbalk (96px = sluiter + padding), zodat het hele kader zichtbaar is */
    #cam video, #cam img, #cam canvas { position: absolute; top: 0; left: 0; width: 100%; height: calc(100% - 96px - env(safe-area-inset-bottom, 0px)); object-fit: contain; }
    #cam.cut video { opacity: 0; } /* blijft spelen voor de segmenter; het canvas toont het beeld */
    #cam.cut #ghost, #cam.cut .top, #cam:not(.cut) #live, #cam.shot #live { display: none; }
    #cam .wait { display: none; position: absolute; left: 0; right: 0; top: 45%; margin: 0; text-align: center; color: #fff; font-size: 0.9rem; }
    #cam.cut:not(.ready):not(.shot) .wait { display: block; }
    #cam.cut:not(.ready) .bottom .shutter { opacity: .4; pointer-events: none; }
    #ghost { opacity: .45; pointer-events: none; }
    #cam .top { position: absolute; z-index: 1; top: max(14px, env(safe-area-inset-top)); left: 14px; right: 56px; display: flex; align-items: center; gap: 10px;
                color: #fff; font-size: 0.8rem; text-shadow: 0 0 4px rgba(0,0,0,.8); }
    #cam .top input { flex: 1; max-width: 220px; margin: 0; accent-color: var(--blue); }
    #cam .bottom { position: absolute; z-index: 1; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; align-items: center; gap: 24px;
                   padding: 14px 16px max(16px, env(safe-area-inset-bottom)); background: rgba(0,0,0,.5); }
    #cam .bottom button, #cam .bottom i { border: 0; background: none; color: #fff; font-weight: 600; padding: 8px 4px; min-width: 88px; cursor: pointer; }
    #cam .bottom .shutter { width: 66px; height: 66px; min-width: 0; padding: 0; border-radius: 50%; background: #fff; border: 4px solid rgba(255,255,255,.4); background-clip: padding-box; }
    #cam.shot video, #cam.shot #ghost, #cam.shot .top, #cam.shot .live { display: none; }
    #cam:not(.shot) #shot, #cam:not(.shot) .done { display: none; }

    #full { position: fixed; inset: 0; z-index: 10; background: #000; display: none; flex-direction: column; }
    #full.on { display: flex; }
    #full img { flex: 1; min-height: 0; width: 100%; object-fit: contain; }
    #full figcaption { color: #fff; padding: 10px 16px max(12px, env(safe-area-inset-bottom)); font-size: 0.85rem; display: flex; gap: 10px; justify-content: space-between; }
    #full .close, #cam .close { top: max(8px, env(safe-area-inset-top)); }
  </style>
  <link rel="stylesheet" href="../design.css"> <!-- gedeelde tokens; als laatste -->
</head>
<body>
  <div id="app">
    <div id="map" role="region" aria-label="Kaart met historische foto’s van Utrecht"></div>

    <div class="bar">
      <button type="button" class="chip primary" id="near"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg><span>Dicht bij mij</span></button>
      <label class="chip"><span class="n">Straal</span><select id="radius" aria-label="Zoekstraal">
        <option value="250">250 m</option><option value="500">500 m</option><option value="1000" selected>1 km</option><option value="5000">5 km</option>
      </select></label>
      <label class="chip"><input id="yfrom" type="number" min="1800" max="1997" value="1800" aria-label="Van jaar" /><span class="n">–</span><input id="yto" type="number" min="1800" max="1997" value="1997" aria-label="Tot jaar" /></label>
      <button type="button" class="chip" id="storiesBtn" aria-expanded="false">Verhalen <span class="n" id="storiesN"></span></button>
      <span class="chip n" id="count" aria-live="polite"></span>
    </div>
    <div id="stories" role="group" aria-label="Bijdragen van andere platforms">
      <p>Alleen links naar verhalen; geen beelden of teksten van deze sites.</p>
      <div id="providers"></div>
    </div>
    <p id="msg" role="status"><span></span><button type="button" aria-label="Sluit melding">×</button></p>

    <div id="dock" aria-label="Dichtstbijzijnde foto’s"></div>

    <article id="sheet" aria-label="Geselecteerde historische foto"></article>

    <figure id="full" role="dialog" aria-modal="true" aria-label="Volledige foto">
      <button type="button" class="close" id="fullClose" aria-label="Sluit volledige foto">×</button>
      <img alt="" />
      <figcaption><strong></strong><span></span></figcaption>
    </figure>

    <div id="cam" role="dialog" aria-modal="true" aria-label="Camera bij de oude foto">
      <video autoplay playsinline muted></video>
      <img id="ghost" alt="" crossorigin="anonymous" />
      <img id="shot" alt="Resultaat" />
      <canvas id="live" aria-label="Jij in de oude foto"></canvas>
      <p class="wait">Uitsnijden laden…</p>
      <button type="button" class="close" id="camClose" aria-label="Sluit camera">×</button>
      <div class="top"><span>Oude foto</span><input id="ghostOp" type="range" min="0" max="100" value="45" aria-label="Doorzichtigheid van de oude foto" /></div>
      <div class="bottom">
        <button type="button" class="live" id="camFlip">Wissel camera</button>
        <button type="button" class="live shutter" id="camShoot" aria-label="Maak foto"></button>
        <i class="live" aria-hidden="true"></i>
        <button type="button" class="done" id="camRetry">Opnieuw</button>
        <button type="button" class="done" id="camSave">Opslaan</button>
        <button type="button" class="done" id="camShare">Delen</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.8.0/maplibre-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation@0.1.1675465747/selfie_segmentation.js"></script>
  <script src="boot.js"></script>
</body>
</html>
