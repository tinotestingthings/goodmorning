<!doctype html>
<html lang="nl">
<head>
  <script src="../theme-sync.js"></script>
  <script>try { if (window.top !== window.self) document.documentElement.className = "embedded"; } catch (e) {}</script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Luisterinus</title>
  <style>
    /* Vangnet als ../design.css niet laadt: zonder deze regels valt elke var()
       weg en krijg je een transparante serif-pagina op een witte iframe. */
    :root { --bg: #f5f6f8; --card: #fff; --text: #1a1d24; --muted: #5a6270; --line: #dde1e6;
            --blue: #4a90d9; --red: #d9534f; --radius: 14px;
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); padding: 16px 16px 24px; max-width: 640px; margin-inline: auto; }
    /* alleen ruimte vrijhouden als de speler er echt staat */
    body.with-player { padding-bottom: 104px; }
    .head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .head .act { flex-shrink: 0; padding-top: 4px; }
    h1 { font-size: 1.15rem; margin: 0 0 2px; }
    .sub { color: var(--muted); font-size: 0.82rem; margin: 0; line-height: 1.35; }
    /* In de Utilities-iframe staat de naam al in de frame-header: geen tweede kop. */
    .scope { display: none; }
    /* In de Utilities-iframe: geen tweede naam, wel een korte scope-regel links
       zodat de Ververs-knop niet los in de ruimte hangt. */
    .embedded h1, .embedded .sub { display: none; }
    .embedded .scope { display: block; color: var(--muted); font-size: 0.82rem; margin: 0; }
    .embedded .head { margin-bottom: 8px; align-items: baseline; }
    .row { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 11px 13px; margin-bottom: 8px; }
    /* de kop is een knop over de volle breedte: klikbaar als een rij, maar ook
       bereikbaar met toetsenbord en VoiceOver */
    .rowhead { display: block; width: 100%; padding: 0; border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
    .rowhead:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; border-radius: 6px; }
    .row.done { opacity: 0.55; }
    .row.playing { border-color: var(--blue); }
    .title { font-weight: 600; font-size: 0.95rem; line-height: 1.35; }
    .meta { color: var(--muted); font-size: 0.8rem; margin-top: 3px; }
    .status { color: var(--muted); font-size: 0.85rem; margin-top: 6px; }
    .status.failed { color: var(--red); }
    /* acties: alleen zichtbaar na een tik op de rij; tekstknoppen in de accentkleur */
    .acts { display: none; gap: 14px; flex-wrap: wrap; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
    .row.open .acts { display: flex; }
    .act { border: 0; background: none; padding: 0; color: var(--blue); font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; }
    .act-done { color: var(--muted); font-size: 0.9rem; }
    .act.danger { color: var(--red); margin-left: auto; }
    .act:disabled { opacity: 0.5; }
    .empty, #msg { color: var(--muted); font-size: 0.9rem; }
    #msg:empty { display: none; }
    /* vaste mini-speler onderaan; verschijnt pas bij afspelen */
    #player { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); display: none; }
    #player.on { display: block; }
    #player .inner { max-width: 640px; margin-inline: auto; }
    #player .prow { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    #player .ptitle { flex: 1; min-width: 0; font-size: 0.85rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #pclose { font-size: 1.25rem; line-height: 1; color: var(--muted); }
    #player audio { width: 100%; height: 36px; }
    /* Eigen bevestiging: het native confirm() wordt in een iframe niet altijd
       getoond, en dan lijkt een knop niets te doen. <dialog> geeft Escape,
       focus-trap en een backdrop gratis. */
    #ask { border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); color: var(--text);
           padding: 18px; max-width: 300px; font-family: var(--font); }
    #ask::backdrop { background: rgba(0, 0, 0, 0.5); }
    #askText { margin: 0 0 16px; font-size: 0.95rem; line-height: 1.4; }
    .ask-actions { display: flex; justify-content: flex-end; gap: 18px; }
    .ask-actions .act { font-size: 0.95rem; }
  </style>
  <link rel="stylesheet" href="../design.css"> <!-- gedeelde tokens; als laatste -->
</head>
<body>
  <div class="head">
    <div>
      <h1>Luisterinus</h1>
      <p class="sub">Podcasts uit je digest — de laatste 14 dagen. Tik op een aflevering voor acties.</p>
      <p class="scope">Laatste 14 dagen</p>
    </div>
    <button type="button" class="act" id="refresh">Ververs</button>
  </div>
  <p id="msg"></p>
  <div id="list"></div>
  <dialog id="ask">
    <p id="askText"></p>
    <div class="ask-actions">
      <button type="button" class="act" id="askCancel">Annuleren</button>
      <button type="button" class="act" id="askOk">Ja</button>
    </div>
  </dialog>
  <div id="player"><div class="inner"><div class="prow"><div class="ptitle" id="ptitle"></div><button type="button" class="act" id="pclose" aria-label="Speler sluiten">×</button></div><audio id="audio" controls preload="none"></audio></div></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="boot.js"></script>
</body>
</html>
